spring.application.name=allport-api
server.port=9090

# PostgreSQL (se pueden sobrescribir con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/allport_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Paginacion: page empieza en 0 y el cliente no puede pedir mas de 50 por pagina
spring.data.web.pageable.default-page-size=5
spring.data.web.pageable.max-page-size=50
spring.data.web.pageable.one-indexed-parameters=false
